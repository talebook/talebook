# Talebook-owned main Nginx configuration.
# Site-specific static and SSR settings remain in /etc/nginx/conf.d/.
worker_processes auto;
worker_cpu_affinity auto;
pid /run/talebook/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/access.log;

    gzip on;

    # Large API/download responses must not depend on writable proxy temp storage.
    # Keep memory buffering and apply backpressure instead of spilling to disk.
    proxy_max_temp_file_size 0;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
