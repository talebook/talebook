
upstream tornado {
    server 127.0.0.1:8000;
}

upstream nuxtjs {
    server 127.0.0.1:9000;
}

# 多层nginx的情况下，X-Scheme可能已经被设置过了，需要判断下
map $http_x_scheme $req_scheme {
    # 有值，则透传
    default   $http_x_scheme;

    # 空白，则设置本地的scheme
    ""        $scheme;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /data/books/ssl/ssl.crt;
    ssl_certificate_key /data/books/ssl/ssl.key;

    index index.html;
    client_max_body_size 0;
    root /var/www/talebook/app/.output/public/;
    access_log  /data/log/nginx/talebook-access.log;
    error_log   /data/log/nginx/talebook-error.log;

    # 历史的版本开放了/opds（不带斜线）的接口，导致许多issue咨询
    # 因此增加个302跳转，尝试做个快捷兼容
    location = /opds {
        return 302 /opds/;
    }

    location = /books {
        return 302 /books/;
    }

    # Podcast URL 中包含订阅凭证。独立代理并关闭原始 URI access log，
    # 请求审计由 Tornado 在脱敏后写入 podcast_access_logs。
    location ^~ /podcast/v1/ {
        access_log off;
        expires -1s;
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
    }

    # Keep authorized EPUB stream headers untouched; the generic dynamic
    # location adds `expires` and would replace private/no-store.
    location ^~ /read/resource/ {
        expires off;
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
    }

    location ~ ^/(api|get|read|opds|auth|books|media)/ {
        expires -1s;
        if ( $request_uri ~* ^/get/ ) {
            expires max;
        }
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
    }

    # 启动自检状态，供前端在 502 时读取展示，必须直接由 nginx 静态返回，
    # 不能落入下面的 @ssr fallback，否则 tornado/nodejs 没起来时这份诊断信息本身也拿不到
    location = /status.json {
        alias /var/www/talebook/status/status.json;
        add_header Cache-Control "no-store";
        default_type application/json;
    }
    location = /status_page.html {
        alias /var/www/talebook/status/status_page.html;
        add_header Cache-Control "no-store";
    }

    location = /readest/legacy-worker-cleanup.js {
        expires -1s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Keep missing build artifacts visible as 404 instead of returning a
    # recovery module or falling through to Nuxt SSR.
    location ^~ /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 = @nuxt_asset_missing;
        try_files $uri =404;
    }
    location @nuxt_asset_missing {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    location = /readest/sw.js {
        expires -1s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /readest/talebook-launch.js {
        expires -1s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /readest/talebook-launch.html {
        expires -1s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /readest/reader.html {
        expires -1s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline' blob:; font-src 'self' data:; object-src 'none'; frame-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /readest/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # for ssr mode
    location @ssr {
        proxy_pass       http://nuxtjs;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
    }

    # for spa mode
    # use `npm run build-spa` to generate dist/ dir
    #location = /index.html {
    #    expires -1s;
    #}

    try_files $uri @ssr;
}
