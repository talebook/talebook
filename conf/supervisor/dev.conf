[group:talebook]
programs=booksvr,nginx,nuxtdev

; Tornado 已下线：全部 215 条 legacy 路由由 booksvr 本地实现。
; booksvr 是唯一对外 HTTP 后端，监听 8000。
; dev 环境不跑 bootstrap 自检，因此直接 autostart。
[program:booksvr]
command=/usr/local/bin/booksvr serve -db=/data/books/library/metadata.db -addr=127.0.0.1:8000 -serve-routes=all -library-root=/data/books/library -settings-file=/data/books/settings/auto.py
directory=/var/www/talebook
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:nginx]
command = /usr/sbin/nginx -g 'daemon off;'
user=talebook
autostart=true
autorestart=unexpected

[program:nuxtdev]
command=gosu talebook:talebook npm run dev
directory=/var/www/talebook/app
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=API_URL="http://127.0.0.1:8000"
