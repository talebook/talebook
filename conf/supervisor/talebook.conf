[group:talebook]
programs=nginx,bootstrap,tornado,upgrade

[program:nginx]
command = /usr/sbin/nginx -g 'daemon off;'
user=talebook
autostart=true
autorestart=unexpected

; 启动自检：权限校验、nginx 配置检查、syncdb/migrate/update-config，逐项写入
; status.json；全部通过后才会 `supervisorctl start talebook:tornado`。失败时不重试
; （autorestart=false），nginx 与 /status.json、/status_page.html 仍然可访问。
[program:bootstrap]
command=python3 /opt/talebook-upgrade/self_check.py
environment=TALEBOOK_SERVER_DIR="/run/talebook-release/current"
directory=/var/www/talebook
autostart=true
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; 不再随 group 自动启动，由 bootstrap 自检全部通过后拉起
[program:tornado]
command=gosu talebook:talebook python3 server.py --with-library=/data/books/library --port=8000 --host=127.0.0.1 --logging=debug --log-file-prefix=/data/log/talebook.log
directory=/run/talebook-release/current
stopasgroup=true
killasgroup=true
stopwaitsecs=90
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Trusted executor is part of the image and survives application restarts.
[program:upgrade]
command=python3 /opt/talebook-upgrade/executor.py
directory=/opt/talebook-upgrade
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/data/log/upgrade.log
stdout_logfile_maxbytes=1048576
stdout_logfile_backups=3
