[group:talebook]
programs=nginx,bootstrap,booksvr,upgrade

[program:nginx]
command = /usr/sbin/nginx -g 'daemon off;'
user=talebook
autostart=true
autorestart=unexpected

; 启动自检：权限校验、nginx 配置检查、syncdb/migrate/update-config，逐项写入
; status.json；全部通过后才会 `supervisorctl start talebook:booksvr`。失败时不重试
; （autorestart=false），nginx 与 /status.json、/status_page.html 仍然可访问。
[program:bootstrap]
command=python3 /opt/talebook-upgrade/self_check.py
environment=TALEBOOK_SERVER_DIR="/run/talebook-release/current"
directory=/var/www/talebook
autostart=true
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Tornado 已下线：全部 215 条 legacy 路由由 booksvr 本地实现，不再需要 Python 后端。
; 回滚指引：如需临时回退，重新加回 Python 后端程序段（监听 127.0.0.1:8001），
; 并把 booksvr 的兜底代理指回该地址。

; booksvr 是唯一对外 HTTP 后端，监听 8000，本地服务全部路由。
; autostart=false：由 bootstrap 自检全部通过后再拉起，以保证它晚于 syncdb/migrate
; 打开数据库。密钥经 BOOKSVR_COOKIE_SECRET 环境变量传入（由 self_check.py 从
; settings 读出），不写在命令行，避免 ps 泄露。
[program:booksvr]
command=/usr/local/bin/booksvr serve -db=/data/books/library/metadata.db -addr=127.0.0.1:8000 -serve-routes=all -library-root=/data/books/library -settings-file=/data/books/settings/auto.py
directory=/run/talebook-release/current
stopasgroup=true
killasgroup=true
stopwaitsecs=30
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Trusted executor is part of the image and survives application restarts.
[program:upgrade]
command=python3 /opt/talebook-upgrade/executor.py
directory=/opt/talebook-upgrade
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/data/log/upgrade.log
stdout_logfile_maxbytes=1048576
stdout_logfile_backups=3
