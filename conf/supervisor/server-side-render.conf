[group:talebook]
programs=nginx,nodejs,bootstrap,booksvr

[program:nginx]
command = /usr/sbin/nginx -g 'daemon off;'
user=talebook
autostart=true
autorestart=unexpected

; 启动自检：权限校验、nginx 配置检查、syncdb/migrate/update-config，逐项写入
; status.json；全部通过后才会 `supervisorctl start talebook:booksvr`。失败时不重试
; （autorestart=false），nginx 与 /status.json、/status_page.html 仍然可访问。
[program:bootstrap]
command=python3 /var/www/talebook/webserver/self_check.py
directory=/var/www/talebook
autostart=true
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Tornado 已下线：全部 215 条 legacy 路由由 booksvr 本地实现。
; booksvr 是唯一对外 HTTP 后端，监听 8000。
; autostart=false：由 bootstrap 自检全部通过后再拉起。
[program:booksvr]
command=/usr/local/bin/booksvr serve -db=/data/books/library/metadata.db -addr=127.0.0.1:8000 -serve-routes=all -library-root=/data/books/library -settings-file=/data/books/settings/auto.py
directory=/var/www/talebook
stopasgroup=true
killasgroup=true
stopwaitsecs=30
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:nodejs]
command=gosu talebook:talebook npm run start
directory=/var/www/talebook/app
autorestart=true
redirect_stderr=true
stdout_logfile=/data/log/nodejs.log
