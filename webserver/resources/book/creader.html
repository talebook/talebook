<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F6" />
  <title>{{ book.title }}</title>

  <base href="{{RES}}/static/candle-reader/" />

  <link rel="icon" href="{{RES}}/logo/favicon.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="anonymous">
  <link rel="preload" as="style" onload="this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap">
  <link rel="stylesheet" crossorigin href="style.css?v={{ CANDLE_READER_VERSION }}">

  <script src="js/epub-v0.3.88.js"></script>
  <script type="module">
    import { Reader } from "./candle-reader.es.js?v={{ CANDLE_READER_VERSION }}"

    // 阅读器不直接请求任何后端：划线、评论、回复、赞踩、登录态与听书都通过下面两组回调交给 Talebook。
    // 回调契约见 candle-reader 的 DESIGN.md。
    const API = "{{RES}}/api"
    const BOOK_API = API + "/book/{{ book.id }}"
    const READER = {{ reader_user_json }}
    const AUDIOBOOK_EDITION_ID = {% if audiobook_edition_id %}{{ audiobook_edition_id }}{% else %}null{% endif %}

    // 评论只对登录读者开放：游客读取列表时以 need_login 拒绝，阅读器显示「登录后查看评论」。
    function needLogin() {
      return Object.assign(new Error('登录后查看评论'), { code: 'need_login' })
    }

    async function request(url, options = {}, accept = ['ok']) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      })
      const data = await response.json()
      if (data.err === 'user.need_login') throw needLogin()
      if (!accept.includes(data.err)) throw new Error(data.msg || data.err || '请求失败')
      return data
    }

    function query(params) {
      const search = new URLSearchParams()
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') search.set(key, value)
      })
      return search.toString()
    }

    function page(data) {
      return { items: data.items || [], next_cursor: data.next_cursor || null, has_more: Boolean(data.has_more) }
    }

    // 只把接口认识的字段发出去，回调上下文和阅读器内部字段不外传。
    const WRITABLE = ['client_id', 'annotation_type', 'is_private', 'chapter', 'cfi', 'range_cfi', 'quote_text', 'content', 'color', 'root_id', 'reply_to_id']
    function writable(record) {
      return Object.fromEntries(WRITABLE.filter(key => key in record).map(key => [key, record[key]]))
    }

    const annotationCallbacks = {
      async user() {
        return READER
      },
      async login() {
        window.location.href = "{{BASE_PATH}}/login?next=" + encodeURIComponent(window.location.pathname + window.location.search)
      },
      // 正文标记：当前读者在本章的划线与评论。
      async load({ chapter }) {
        if (!READER) return []
        const data = await request(`${BOOK_API}/annotations?${query({ scope: 'mine', chapter })}`)
        return (data.annotations || []).filter(item => item.annotation_type === 'highlight' || item.annotation_type === 'note')
      },
      async list({ scope, chapter, paragraph_cfi, cursor, limit }) {
        if (!READER) throw needLogin()
        return page(await request(`${BOOK_API}/annotations?${query({ view: scope, chapter, paragraph_cfi, cursor, limit })}`))
      },
      async summary({ chapter }) {
        if (!READER) return []
        return (await request(`${BOOK_API}/annotations/summary?${query({ chapter })}`)).items || []
      },
      async get({ id }) {
        return (await request(`${BOOK_API}/annotations/${id}`)).annotation
      },
      async replies({ root_id, cursor, limit }) {
        if (!READER) throw needLogin()
        return page(await request(`${BOOK_API}/annotations/${root_id}/replies?${query({ cursor, limit })}`))
      },
      async save(record) {
        // 已有记录只改传入的字段；新记录按 client_id 幂等创建。
        const data = record.id
          ? await request(`${BOOK_API}/annotations/${record.id}`, { method: 'PUT', body: JSON.stringify(writable(record)) })
          : await request(`${BOOK_API}/annotations`, { method: 'POST', body: JSON.stringify(writable(record)) })
        return data.annotation
      },
      async remove({ id }) {
        return request(`${BOOK_API}/annotations/${id}`, { method: 'DELETE' })
      },
      async vote({ id, value }) {
        return request(`${BOOK_API}/annotations/${id}/vote`, { method: 'PUT', body: JSON.stringify({ value }) })
      },
    }

    const audiobookCallbacks = AUDIOBOOK_EDITION_ID ? {
      async manifest() {
        const data = await request(`${API}/audio/${AUDIOBOOK_EDITION_ID}`)
        return { manifest: data.manifest, progress: data.progress }
      },
      async timeline({ manifest_id, chapter }) {
        const url = chapter.timeline_url || `${API}/audio/${manifest_id}/chapter/${chapter.number}/timeline`
        return (await request(url)).timeline
      },
      async start_session({ manifest_id, source, device_id }) {
        return request(`${API}/audio/${manifest_id}/sessions`, { method: 'POST', body: JSON.stringify({ source, device_id }) })
      },
      async report_progress({ session_id, chapter_id, position_ms, segment_id, listened_delta_ms, completed, version }) {
        // 其他设备已有更新进度时同样返回最新版本号。
        return request(`${API}/audio-session/${session_id}`, {
          method: 'PATCH',
          body: JSON.stringify({ chapter_id, position_ms, segment_id, listened_delta_ms, completed, version }),
        }, ['ok', 'progress.conflict'])
      },
      async end_session({ session_id }) {
        return request(`${API}/audio-session/${session_id}/close`, { method: 'POST' })
      },
    } : null

    function startReader() {
      document.getElementById('converting').style.display = 'none'
      new Reader('#app', {
        debug: false,
        themes_css: "{{RES}}/static/candle-reader/css/themes.css?v={{ CANDLE_READER_VERSION }}",
        book_url: "{{RES}}{{epub_dir}}/",
        display_url: "",
        book_id: {{ book.id }},
        annotation_callbacks: annotationCallbacks,
        audiobook_callbacks: audiobookCallbacks,
      })
    }

    {% if is_ready %}
    startReader()
    {% else %}
    // 本书无EPUB格式，服务器正在后台转换；轮询等待EPUB就绪后再初始化阅读器，
    // 避免阅读器在转换完成前请求书籍文件而报"加载超时"
    document.getElementById('converting').style.display = 'flex'
    let retries = 180
    function waitReady() {
      fetch("{{RES}}{{epub_dir}}/META-INF/container.xml?t=" + Date.now())
        .then(function(rsp) {
          if (rsp.ok) {
            startReader()
            return
          }
          retry()
        })
        .catch(retry)
    }
    function retry() {
      retries -= 1
      if (retries <= 0) {
        document.getElementById('converting-msg').textContent = "转换超时，请刷新页面重试，或联系管理员查看转换日志"
        return
      }
      setTimeout(waitReady, 2000)
    }
    waitReady()
    {% endif %}
  </script>
  <style>
    #converting {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #333;
      font-family: Roboto, sans-serif;
      text-align: center;
      padding: 0 24px;
    }
    #converting .spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 24px;
      border: 4px solid #ddd;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: converting-spin 1s linear infinite;
    }
    @keyframes converting-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) { #converting .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="converting">
    <div class="spinner"></div>
    <h3>{{ book.title }}</h3>
    <p id="converting-msg">首次在线阅读，服务器正在将本书转换为 EPUB 格式，<br>预计需要 1~2 分钟，请耐心等待，转换完成后将自动打开。</p>
  </div>
</body>
</html>
