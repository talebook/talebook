version: "2.4"

services:

  # main service
  talebook:
    restart: always
    image: talebook/talebook
    volumes:
      # 持久化配置、用户数据库、书库及 books/ai 产物；备份/迁移时应整体保留此目录
      - "${TALEBOOK_DATA_DIR:-./data}:/data"
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      # 如果需要上传ssl证书，请将PUID与PGID设置为0（root用户）
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    depends_on:
      - douban-rs-api

  # optional, for meta plugins
  # please set "http://douban-rs-api" in settings
  douban-rs-api:
    restart: always
    image: ghcr.io/cxfksword/douban-api-rs
