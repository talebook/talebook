name: Code Quality Check and Build

on:
  push:
    branches:
      - master
      - dev
      - dev-*
  pull_request:
    branches:
      - master

jobs:
  check-design:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate internal design documents
        run: make check-design

  test-server:
    runs-on: ubuntu-latest
    container:
      image: talebook/talebook-base:latest
      options: --user root

    steps:
      - name: Install git (required for submodule checkout in container)
        run: |
          if ! command -v git >/dev/null 2>&1 || [ "$(git --version | awk '{print $3}' | cut -d. -f1,2)" \< "2.18" ]; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect environment
        run: |
          command -v ebook-convert
          ebook-convert --version
          command -v calibredb
          calibredb --version
          command -v make
          make --version
          python3 --version
          pip3 --version

      - name: Install Python dependencies
        run: make init

      - name: Lint with ruff
        run: make lint-py

      - name: Run tests with pytest
        run: make pytest

  test-ui:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Run linting
        run: |
          cd app
          npm run lint

      - name: Nuxt build
        run: |
          cd app
          npm run build

      - name: Generate build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: app/.nuxt
          retention-days: 1

  test-library-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      API_URL: http://127.0.0.1:8080
      MOCK_API_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Test metadata contract and pagination components
        run: npx vitest run --maxWorkers=1 test/utils/metadata-pagination.spec.ts test/components/MetaList.spec.ts test/components/useMetadataPage.spec.ts test/components/LocalLibraryContent.spec.ts test/components/LibraryChipFilter.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run library browser regressions (including picker and keyboard cases)
        run: npx playwright test -c playwright.library.config.ts
      - name: Upload browser results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-browser-results
          path: app/test-results
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: [check-design, test-server, test-ui, test-library-browser]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: All tests passed
        run: |
          echo "✅ All tests completed successfully"
          echo "Server tests: ✓"
          echo "UI tests: ✓"
